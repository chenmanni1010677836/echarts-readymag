<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嵌套饼图-听力障碍人群</title>
  <!-- 用国内可访问的 ECharts CDN，加载更快 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * {margin:0;padding:0;box-sizing:border-box}
    html,body {width:100%;height:100%;overflow:hidden;background:transparent}
    #container {width:100%;height:100%}
  </style>
</head>
<body>
  <div id="container"></div>

  <script type="text/javascript">
    var dom = document.getElementById('container');
    var myChart = echarts.init(dom, null, {
      renderer: 'canvas',
      useDirtyRect: false
    });
    
    // 这是你的嵌套饼图配置（核心，改数据/样式都在这里）
    var option = {
      backgroundColor: 'transparent', // 背景透明，适配 Readymag 页面
      tooltip: {
        trigger: 'item',
        formatter: '{a} <br/>{b}: {c}万人 ({d}%)'
      },
      legend: {
        data: ['听力障碍人群','其他残疾人群']
      },
      series: [
        {
          name: '残疾人总体',
          type: 'pie',
          selectedMode: 'single',
          radius: [0, '30%'],
          label: {position: 'inner',fontSize: 14},
          labelLine: {show: false},
          data: [{value: 2780, name: '听力障碍人群', selected: true},{value: 5720, name: '其他残疾人群'}],
          itemStyle: {
            color: function(params) {
              const colorList = ['#fdae4f', '#f58232'];
              return colorList[params.dataIndex];
            }
          }
        },
        {
          name: '人群细分',
          type: 'pie',
          radius: ['45%', '60%'],
          labelLine: {length: 30},
          label: {
            formatter: '{a|{a}}{abg|}\n{hr|}\n  {b|{b}：}{c}万人  {per|{d}%}  ',
            backgroundColor: '#F6F8FC',
            borderColor: '#8C8D8E',
            borderWidth: 1,
            borderRadius: 4,
            rich: {
              a: {color: '#6E7079',lineHeight: 22,align: 'center'},
              hr: {borderColor: '#8C8D8E',width: '100%',borderWidth: 1,height: 0},
              b: {color: '#4C5058',fontSize: 14,fontWeight: 'bold',lineHeight: 33},
              per: {color: '#fff',backgroundColor: '#4C5058',padding: [3,4],borderRadius: 4}
            }
          },
          data: [{value: 2780, name: '听力障碍人群'},{value: 5720, name: '其他残疾人群'}],
          itemStyle: {
            color: function(params) {
              const colorList = ['#fdae4f', '#f58232'];
              return colorList[params.dataIndex];
            }
          }
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }
    // 关键：iframe 缩放时图表自动适配
    window.addEventListener('resize', () => myChart.resize());
  </script>
</body>
</html>
